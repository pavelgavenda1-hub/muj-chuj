name: world_traveler_stone
description: A Flutter app for tracking stone travels around the world with QR codes

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.4
  firebase_messaging: ^16.0.4

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3

  # GPS & Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1

  # Maps
  google_maps_flutter: ^2.5.0

  # Notifications
  flutter_local_notifications: ^19.5.0

  # Image
  image_picker: ^1.0.4

  # UI
  cupertino_icons: ^1.0.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
